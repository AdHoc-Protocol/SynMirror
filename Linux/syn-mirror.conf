# SYN Mirror on this computer. After a change: systemctl reload syn-mirror - or change it by `syn-mirror`, which reloads it itself

# 16 characters: whoever knows them can get and open a port of meeting; install.sh makes them when empty
PASSWORD=
# the range: the first port answers the requests for a port, the others are the ports of meeting it gives
FIRST=40000
LAST=49999
# seconds a port stays open after its first side stops dialing it
WAIT=60
# wrong knocks an address may make; one more comes back each minute
TRIES=5
# seconds an address that knocked wrong too often is blocked, or guessed at a port too often
BLOCK=600
# the guard against guessing passwords: a meeting that ends within SHORT seconds is short - a password tried and refused -; more
# than GUESSES short meetings of an address at a port, one more back each 10 minutes, and that address is blocked at that port.
# GUARD=0: off, for a server whose meetings are short by nature
GUARD=1
SHORT=20
GUESSES=5
# fixed ports: port:key[:name], spaces between - each opened by its key alone, the same port at each start
FIXED=""
# the records this computer keeps of meeting points whose address changes: name:write key:read key[,read key...]
RECORDS=""
# where this computer writes its own address, its address changing: [port to knock at=]write key[/read key]@meeting point:port
REPORTS=""
# a name or an address of this computer for the lines of the servers; empty: found
ADDRESS=
